<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกการออกปฏิบัติการ EMS CHA-AM</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#eaf0f9;--card:#fff;--ink:#14243b;--mute:#5f6f86;--line:#d3dcea;--in:#f4f7fc;--red:#e5173f;--blue:#1f6feb;--teal:#0e9f8a;--amber:#e8a200;--vio:#7a4de8;--ok:#0a8f5c}
@media(prefers-color-scheme:dark){:root{--bg:#0d1522;--card:#16212f;--ink:#e8eef8;--mute:#93a3bb;--line:#2a3a50;--in:#0f1a28;--red:#ff5470;--blue:#5b9bff;--teal:#2ed3b9;--amber:#ffc04d;--vio:#a58bff;--ok:#3ccf91}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai",system-ui,sans-serif;padding:0 12px 100px}
header{margin:0 -12px 12px;padding:18px 16px;background:linear-gradient(135deg,#e5173f,#a80b38 55%,#1f3b8f);color:#fff}
header h1{font:700 20px/1.3 Prompt,sans-serif;margin:0}
header p{margin:2px 0 0;opacity:.85;font-size:14px}
.card{background:var(--card);border-radius:14px;border-top:4px solid var(--c);margin:0 0 12px;padding:4px 14px 14px;box-shadow:0 2px 6px rgba(20,36,59,.12)}
h2,summary{font:600 17px Prompt,sans-serif;color:var(--c);margin:12px 0 4px}
summary{cursor:pointer}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--in);border:1.5px solid var(--line);border-radius:10px;padding:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:0;border-color:var(--c,var(--blue));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--blue)) 25%,transparent)}
button{font:inherit;border-radius:10px;border:1.5px solid var(--line);background:var(--in);color:var(--ink);padding:10px 12px;min-height:44px}
.g2,.g3{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.fl{display:flex;gap:8px;align-items:center}.fl input:last-child{flex:0 0 88px;width:88px}
.t{display:flex;align-items:center;gap:8px;margin:8px 0}
.t button{flex:0 0 112px;padding:10px 4px;background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
.t input[type=time]{flex:1;min-width:0}
.t .m{flex:0 0 100px;width:100px;text-align:center;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;color:var(--ink);font-size:15px}
.chips input{display:none}
.chips span{display:block;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--in)}
.chips input:checked+span{background:var(--c);border-color:var(--c);color:var(--tx,#fff);font-weight:600}
.maps{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.maps button{flex:1 1 130px;border-color:var(--blue);color:var(--blue);font-weight:500}
#save{position:fixed;left:12px;right:12px;bottom:12px;background:linear-gradient(135deg,#e5173f,#b00c3a);border:0;color:#fff;font:600 17px Prompt,sans-serif;min-height:54px;box-shadow:0 4px 12px rgba(229,23,63,.4)}
#save:disabled{opacity:.5}
#msg{position:fixed;left:16px;right:16px;bottom:78px;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;display:none;z-index:5}
</style>
</head>
<body>
<header><h1>แบบบันทึกการออกปฏิบัติการ</h1><p>ทีม EMS CHA-AM · Prototype 1.0</p></header>
<div id="msg"></div>

<section class="card" style="--c:var(--red)">
  <h2>ข้อมูลทั่วไป</h2>
  <label for="date">Date</label><input id="date" type="date">
  <label>ประเภททีม</label>
  <div class="chips" id="mode" style="--c:var(--red)"></div>
  <label>เจ้าหน้าที่</label>
  <input id="staff1" placeholder="1." style="margin-bottom:8px"><input id="staff2" placeholder="2." style="margin-bottom:8px"><input id="staff3" placeholder="3.">
</section>

<section class="card" style="--c:var(--amber)">
  <h2>สถานที่เกิดเหตุ</h2>
  <label for="loc">สถานที่</label><textarea id="loc" rows="2"></textarea>
  <label for="tel">Tel.</label><input id="tel" type="tel" inputmode="tel">
  <label for="map">ลิงก์ Google Maps</label>
  <input id="map" inputmode="url" placeholder="ดึงพิกัด หรือวางลิงก์ที่คัดลอกจาก Google Maps">
  <div class="maps">
    <button type="button" id="gps">📍 ดึงพิกัดปัจจุบัน</button>
    <button type="button" id="mapq">🔎 ค้นชื่อสถานที่</button>
    <button type="button" id="mapo">🗺️ เปิดดูแผนที่</button>
  </div>
  <label>เหตุการณ์</label>
  <div class="chips" id="ev" style="--c:var(--amber);--tx:#14243b"></div>
  <label for="ev_other">อื่น ๆ (ระบุ)</label><input id="ev_other">
</section>

<section class="card" style="--c:var(--blue)">
  <h2>เวลา และเลขไมล์</h2>
  <div id="times"></div>
</section>

<section class="card" style="--c:var(--teal)"><h2>ผู้ป่วยรายที่ 1</h2><div id="pt1"></div></section>
<details class="card" style="--c:var(--vio)"><summary>＋ ผู้ป่วยรายที่ 2 (ถ้ามี)</summary><div id="pt2"></div></details>

<section class="card" style="--c:var(--red)">
  <h2>ทะเบียนรถ</h2>
  <input id="plate" aria-label="ทะเบียนรถ">
</section>

<button id="save" type="button">บันทึกเคส</button>

<script>
/* ============ ✏️ จุดที่ต้องแก้ (3 ที่) ============ */
const LIFF_ID = "2012018268-3LN2vNKu";                              // 1) LIFF ID จาก LINE Developers
const GAS_URL = "https://script.google.com/macros/s/AKfycbwyPmBRUqOolE2DWG9nxRmFLaVrkttRYffbHqiAT4WALMJ2heShRkNPFjcCpK_drnQh/exec";     // 2) Web app URL จาก Apps Script
const UNIT    = "EMS CHA-AM";                                       // 3) ชื่อหน่วย
/* ================================================= */

const $ = id => document.getElementById(id);
const chip = (type, name, v, c, tx) => `<label style="--c:${c};${tx ? "--tx:#14243b" : ""}"><input type="${type}" name="${name}" value="${v}"><span>${v}</span></label>`;
const chips = (id, type, vals) => $(id).innerHTML = vals.map(v => chip(type, id, ...[].concat(v))).join("");
let toastT;
const msg = (t, ok) => { const m = $("msg"); m.textContent = t; m.style.display = "block"; m.style.background = ok ? "var(--ok)" : "var(--red)"; m.style.color = "#fff"; clearTimeout(toastT); toastT = setTimeout(() => m.style.display = "none", 6000); };

chips("mode", "radio", ["ALS", "BLS"]);
chips("ev", "checkbox", ["อุบัติเหตุจราจร", "อุบัติเหตุทั่วไป", "ป่วยฉุกเฉิน", "กรณี ว.14", "ไม่มีเหตุ", "หน่วยงานอื่นนำส่ง"].map(v => [v, "var(--amber)", 1]));

/* เวลา: [id เวลา, ชื่อ, id เลขไมล์ (ถ้ามี)] */
const TM = [["t_call","รับแจ้งจากศูนย์"],["t_depart","ออกจาก รพ.","m_depart"],["t_scene","ถึงเหตุ","m_scene"],["t_leave","ออกจากเหตุ"],["t_hosp","ถึง รพ.","m_hosp"],["t_base","ถึงฐาน","m_base"]];
$("times").innerHTML = TM.map(([t,l,m]) => `<div class="t"><button type="button" data-t="${t}">${l}</button><input type="time" id="${t}" aria-label="เวลา${l}">${m ? `<input class="m" id="${m}" inputmode="numeric" maxlength="6" placeholder="เลขไมล์" aria-label="เลขไมล์${l}">` : ""}</div>`).join("");
const MILES = TM.filter(x => x[2]).map(x => x[2]);

/* ผู้ป่วย */
const PROC = [["air","ทางเดินหายใจ"],["bleed","การห้ามเลือด"],["fluid","การให้สารน้ำ"],["splint","การดามกระดูก"]];
const PO = ["ไม่จำเป็น","ไม่ได้ทำ","ทำและเหมาะสม","ทำแต่ไม่เหมาะสม"];
const op = (a, b) => "<option></option>" + Array.from({length: b-a+1}, (_, i) => `<option>${a+i}</option>`).join("");
const f = (n, k, l, extra = "") => `<div><label for="p${n}_${k}">${l}</label><input id="p${n}_${k}" ${extra}></div>`;
const pt = n => `
<label for="p${n}_name">ชื่อ-สกุล</label><input id="p${n}_name">
<div class="g2"><div><label for="p${n}_sex">เพศ</label><select id="p${n}_sex"><option></option><option>ชาย</option><option>หญิง</option></select></div>${f(n,"age","อายุ (ปี)",'type="number" inputmode="numeric"')}</div>
<label for="p${n}_cid">เลขบัตรประชาชน</label><input id="p${n}_cid" inputmode="numeric" maxlength="13">
${f(n,"hn","HN")}
<label for="p${n}_sym">อาการ</label><textarea id="p${n}_sym" rows="2"></textarea>
<label>V/S</label>
<div class="fl" style="margin-bottom:8px"><input id="p${n}_bp_s" inputmode="numeric" placeholder="BP บน"><b>/</b><input id="p${n}_bp_d" inputmode="numeric" placeholder="BP ล่าง" style="flex:1;width:auto"></div>
<div class="g2">${f(n,"p","P",'inputmode="numeric"')}${f(n,"r","R",'inputmode="numeric"')}${f(n,"o2","O2sat",'inputmode="numeric"')}${f(n,"dtx","DTX",'inputmode="numeric"')}</div>
<label>GCS</label>
<div class="g3"><div><label for="p${n}_gcs_e">E (1-4)</label><select id="p${n}_gcs_e">${op(1,4)}</select></div><div><label for="p${n}_gcs_v">V (1-5)</label><select id="p${n}_gcs_v">${op(1,5)}</select></div><div><label for="p${n}_gcs_m">M (1-6)</label><select id="p${n}_gcs_m">${op(1,6)}</select></div></div>
<label for="p${n}_tx">การรักษา</label><textarea id="p${n}_tx" rows="2"></textarea>
${PROC.map(([k,l]) => `<label for="p${n}_${k}">${l}</label><select class="pr" id="p${n}_${k}"><option></option>${PO.map(o => `<option>${o}</option>`).join("")}</select><input id="p${n}_${k}_x" placeholder="ระบุเหตุผล" hidden style="margin-top:6px">`).join("")}`;
$("pt1").innerHTML = pt(1); $("pt2").innerHTML = pt(2);
document.querySelectorAll(".pr").forEach(s => s.addEventListener("change", () => $(s.id + "_x").hidden = s.value !== PO[3]));

/* ปุ่มประทับเวลา / กรองเลขไมล์ */
document.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => $(b.dataset.t).value = new Date().toTimeString().slice(0, 5)));
MILES.forEach(id => $(id).addEventListener("input", e => e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6)));

/* แผนที่ */
const openUrl = u => { try { liff.openWindow({url: u, external: true}); } catch (e) { window.open(u, "_blank"); } };
$("gps").addEventListener("click", () => {
  if (!navigator.geolocation) return msg("เครื่องนี้ดึงพิกัดไม่ได้ ใช้ปุ่มค้นชื่อสถานที่หรือวางลิงก์แทน");
  msg("กำลังหาพิกัด...", 1);
  navigator.geolocation.getCurrentPosition(
    p => { $("map").value = `https://www.google.com/maps?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`; msg(`ได้พิกัดแล้ว (คลาดเคลื่อน ~${Math.round(p.coords.accuracy)} ม.)`, 1); },
    er => msg(er.code === 1 ? "LINE ยังไม่ได้รับสิทธิ์ตำแหน่ง: ตั้งค่ามือถือ > LINE > ตำแหน่ง > ขณะใช้งานแอป" : "หาพิกัดไม่ได้ ลองไปที่โล่ง หรือใช้ปุ่มค้นชื่อสถานที่/วางลิงก์แทน"),
    {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
});
$("mapq").addEventListener("click", () => $("loc").value ? openUrl("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent($("loc").value)) : msg("พิมพ์ชื่อสถานที่ก่อน"));
$("mapo").addEventListener("click", () => /^https?:/.test($("map").value) ? openUrl($("map").value) : msg("ยังไม่มีลิงก์แผนที่"));

/* บันทึก */
let profile = {};
$("save").addEventListener("click", async () => {
  const bad = MILES.find(id => $(id).value && $(id).value.length !== 6);
  if (bad) { msg("เลขไมล์ต้องครบ 6 หลัก"); $(bad).focus(); return; }
  $("save").disabled = true; msg("กำลังบันทึก...", 1);
  const data = {unit: UNIT};
  document.querySelectorAll("input[id],select[id],textarea[id]").forEach(e => data[e.id] = e.value);
  ["mode"].forEach(n => { const c = document.querySelector(`input[name="${n}"]:checked`); data[n] = c ? c.value : ""; });
  data.ev = [...document.querySelectorAll('input[name="ev"]:checked')].map(c => c.value).join(", ");
  try {
    await fetch(GAS_URL, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain"}, body: JSON.stringify({idToken: liff.getIDToken(), data})});
    msg("บันทึกแล้ว ✓", 1); setTimeout(() => location.reload(), 1200);
  } catch (e) { msg("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง"); $("save").disabled = false; }
});

$("date").value = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
liff.init({liffId: LIFF_ID}).then(async () => {
  if (!liff.isLoggedIn()) return liff.login();
  
}).catch(() => msg("เปิดใน LINE เท่านั้น / LIFF ID ยังไม่ถูกตั้งค่า"));
</script>
</body>
</html>
